[workspace]
members = ["fuzz", "playgrounds/local_env_vault", "xtask"]

[workspace.package]
version = "0.0.0-pre.9"
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "paranoid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Misuse-resistant application security and Postgres-backed distributed systems primitives."
readme = "README.md"
repository = "https://github.com/sjc5/paranoid"
include = [
	"/src",
	"/benches",
	"/tests",
	"/Cargo.toml",
	"/README.md",
]

# `fuzzing` is set by cargo-fuzz (via RUSTFLAGS) when building the fuzz crate; it gates the
# fuzz-only `db_fuzz` entry points. Declare it so `-D warnings` builds without it stay clean.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
atomic-write-file = { version = "0.3.0", optional = true }
aes-gcm-siv = { version = "0.11.1", default-features = false, features = [
	"aes",
	"alloc",
], optional = true }
argon2 = { version = "0.5.3", features = ["zeroize"], optional = true }
blake3 = { version = "1.8.5", features = ["zeroize"], optional = true }
bs58 = { version = "0.5.1", optional = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = [
	"alloc",
], optional = true }
cookie = { version = "0.18.1", optional = true }
data-encoding = { version = "2.11.0", optional = true }
getrandom = { version = "0.3.4", optional = true }
http = { version = "1.4.0", optional = true }
hkdf = { version = "0.12.4", optional = true }
hmac = { version = "0.12.1", optional = true }
inquire = { version = "0.9.4", default-features = false, features = [
	"crossterm",
], optional = true }
ml-kem = { version = "0.3.2", default-features = false, features = [
	"alloc",
	"zeroize",
], optional = true }
pg-embed = { version = "1.0.0", default-features = false, features = [
	"rt_tokio",
], optional = true }
postcard = { version = "1.1.3", default-features = false, features = [
	"alloc",
], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
	"rustls",
], optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = [
	"zeroize",
], optional = true }
rpassword = { version = "7.4.0", optional = true }
secrecy = { version = "0.10.3", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = [
	"json",
	"postgres",
	"runtime-tokio",
	"tls-rustls",
	"time",
], optional = true }
subtle = { version = "2.6.1", optional = true }
thiserror = { version = "2.0.18", optional = true }
time = { version = "0.3.47", default-features = false, features = [
	"formatting",
], optional = true }
tokio = { version = "1.52.3", default-features = false, features = [
	"macros",
	"rt",
	"sync",
	"time",
], optional = true }
tokio-postgres = { version = "0.7.15", optional = true }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.19.0", default-features = false, optional = true }
zeroize = { version = "1.8.2", optional = true }


[features]
default = []
component-authoring = ["db", "web"]
crypto = [
	"dep:aes-gcm-siv",
	"dep:argon2",
	"dep:blake3",
	"dep:bs58",
	"dep:chacha20poly1305",
	"dep:data-encoding",
	"dep:getrandom",
	"dep:hkdf",
	"dep:hmac",
	"dep:ml-kem",
	"dep:postcard",
	"dep:ed25519-dalek",
	"dep:secrecy",
	"dep:serde",
	"dep:sha2",
	"dep:subtle",
	"dep:zeroize",
]
db = [
	"crypto",
	"id",
	"dep:serde_json",
	"dep:sqlx",
	"dep:thiserror",
	"dep:time",
	"dep:tokio",
]
db-test-harness = ["db", "dep:pg-embed", "dep:reqwest", "dep:tokio-postgres"]
# Adds a pooler-safe literal encoding for `uuid::Uuid` bind values.
db-uuid = ["db", "dep:uuid", "sqlx/uuid"]
id = ["dep:data-encoding", "dep:getrandom"]
# Selects getrandom's JS backend for wasm32-unknown-unknown builds (pair with
# RUSTFLAGS --cfg getrandom_backend="wasm_js"); native builds never need it.
getrandom-wasm-js = ["getrandom/wasm_js"]
local-env-vault = [
	"dep:atomic-write-file",
	"crypto",
	"local-lock",
	"dep:inquire",
	"dep:rpassword",
	"dep:serde_json",
]
local-lock = ["dep:serde", "dep:serde_json"]
web = [
	"crypto",
	"dep:cookie",
	"dep:http",
	"dep:tower-layer",
	"dep:tower-service",
	"dep:url",
]

[dev-dependencies]
base64 = "0.22.1"
proptest = "1.6.0"
rand = "0.9.4"
rand_chacha = "0.9.0"
secrecy = "0.10.3"
sqlx = { version = "0.9.0", default-features = false, features = [
	"json",
	"postgres",
	"runtime-tokio",
	"tls-rustls",
] }
tokio = { version = "1.52.3", default-features = false, features = [
	"macros",
	"rt-multi-thread",
] }

[[test]]
name = "db_bootstrap_postgres"
required-features = ["db"]

[[test]]
name = "web_stack"
required-features = ["web"]

[[bench]]
name = "id"
harness = false
required-features = ["id"]

[[bench]]
name = "portable_query_round_trip"
harness = false
required-features = ["db"]
