[package]
name = "paranoid-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

# `fuzzing` is set by cargo-fuzz; the db target gates its body on it so it also
# compiles as a no-op in a normal workspace build. Declare it so lint-clean builds stay clean.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.paranoid]
path = ".."
default-features = false
features = ["crypto", "id", "db"]

[[bin]]
name = "paranoid_envelope"
path = "fuzz_targets/paranoid_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paranoid_codecs"
path = "fuzz_targets/paranoid_codecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paranoid_id"
path = "fuzz_targets/paranoid_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paranoid_db_validators"
path = "fuzz_targets/paranoid_db_validators.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paranoid_db_simple_query_literals"
path = "fuzz_targets/paranoid_db_simple_query_literals.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paranoid_db_portable_query_template"
path = "fuzz_targets/paranoid_db_portable_query_template.rs"
test = false
doc = false
bench = false
